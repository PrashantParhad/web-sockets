<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Web socket</title>
        <link rel="stylesheet" href="styles.css">
    </head>
<body>
  <h1>Web socket</h1>
  <p>This is a simple HTML page with a text input and a submit button.</p>  
<div>
  <input type="text" id="messageInput" placeholder="Type a message"/>
  <button type="button" id="sendButton">Submit</button>
  <ul id="messagesList">

  </ul>
</div>
</body>
<script>

  const input = document.getElementById('messageInput');
  const sendButton = document.getElementById('sendButton');
  const messagesList = document.getElementById('messagesList');

  const PORT = window.location.port || 3000;
  const webSocketConnection = new WebSocket('ws://localhost:' + PORT);

  webSocketConnection.onopen = () => {
    webSocketConnection.onmessage=(message)=>{
      console.log('Message from server is :', message);
      // messagesList.innerHTML += `<li>${message.data}</li>`;
      const parsedData = JSON.parse(message.data);
      const li = document.createElement("li")
      li.textContent = parsedData.message
      messagesList.appendChild(li)
    }

    sendButton.addEventListener('click',()=>{
      const message = input.value;
      webSocketConnection.send(JSON.stringify({ message }));
    })
  };

  // webSocketConnection.onopen = ()=>{
  //   // console.log('WebSocket connection established');
    
  //   webSocketConnection.send('Hello from the client!');
  //   webSocketConnection.onmessage = (msg) =>{
  //     console.log('Message from server is :', msg.data);
  //   }
  // }
</script>
</html>
